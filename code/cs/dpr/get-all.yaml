version: 3.0
type: block
short: Get all rows from entity with dapper
language: cs
model: entity
body: |
  public async Task<IEnumerable<{{ .Name | pascal | singular }}>> Get()
  {
    using (var connection = _factory.Create())
    {
      var sql = @"{{ template "sql-select-all" . -}}";        
        try
        {            
            var items = await connection.QueryAsync<{{ .Name | pascal | singular }}>(sql);            
            return items;
        }
        catch (Exception exception)
        {
            _logger.LogError(exception, "Could not get data");
            throw;
        }
    }
  }